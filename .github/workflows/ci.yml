name: Repository CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  structure:
    name: Skill structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/ci-requirements.txt
      - run: python scripts/validate_repository.py structure
      - run: python -m unittest discover -s tests -v
  links:
    name: Local links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/ci-requirements.txt
      - run: python scripts/validate_repository.py links
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v8.24.3 --repo gitleaks/gitleaks --pattern gitleaks_8.24.3_linux_x64.tar.gz --dir "$RUNNER_TEMP"
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks_8.24.3_linux_x64.tar.gz' | (cd "$RUNNER_TEMP" && sha256sum --check)
          tar -xzf "$RUNNER_TEMP/gitleaks_8.24.3_linux_x64.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full history with built-in rules
        run: |
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          "$RUNNER_TEMP/gitleaks" git --config "$RUNNER_TEMP/gitleaks.toml" --gitleaks-ignore-path /dev/null --ignore-gitleaks-allow --no-banner --redact=100 --log-opts="--all"
      - name: Prove secret detection fails closed
        run: |
          mkdir "$RUNNER_TEMP/secret-canary"
          python -c 'import os, secrets, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "secret-canary", "fixture.txt").write_text("gh" + "p_" + secrets.token_hex(18))'
          set +e
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/secret-canary" --config "$RUNNER_TEMP/gitleaks.toml" --gitleaks-ignore-path /dev/null --ignore-gitleaks-allow --no-banner --redact=100
          status=$?
          set -e
          test "$status" -eq 1
